# Continuous integration: lint, unit-test, and build the system on every push and pull request.
# The Playwright e2e suite needs a live Foundry VTT server with the test world launched, so it runs
# locally only (`npm run test:e2e`).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint scripts and Svelte components
        run: npm run eslint

      - name: Lint styles
        run: npm run stylelint

      - name: Run the unit suite
        run: npm test

      - name: Build the system bundle
        run: npm run build

      - name: Compile the compendium packs
        run: npm run build:packs
